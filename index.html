<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
  --room: #120d08;
  --panel: #241a10;
  --panel-edge: #6b4a24;
  --amber: #f2b45c;
  --amber-dim: #a9875c;
  --ember: #e86a4a;
  --ink: #f4e3c6;
  --muted: #7d6448;
  --key: #2c2014;
  --key-used: #1c150d;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --room: #e9dcc3;
    --panel: #f6ecd8;
    --panel-edge: #b88a4f;
    --amber: #8a4f0c;
    --amber-dim: #8a6a43;
    --ember: #b3351c;
    --ink: #2a1c0c;
    --muted: #a68a66;
    --key: #fbf4e6;
    --key-used: #e6d8bf;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] {
  color-scheme: light;
  --room: #e9dcc3; --panel: #f6ecd8; --panel-edge: #b88a4f; --amber: #8a4f0c; --amber-dim: #8a6a43;
  --ember: #b3351c; --ink: #2a1c0c; --muted: #a68a66; --key: #fbf4e6; --key-used: #e6d8bf;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--room);
  color: var(--ink);
  font-family: "Oswald", "Arial Narrow", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.phone {
  position: relative;
  width: 100%; max-width: 860px;
  background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--panel) 85%, var(--amber) 6%), var(--panel) 70%);
  border: 1px solid var(--panel-edge);
  border-radius: 14px;
  box-shadow: inset 0 0 90px color-mix(in srgb, var(--room) 70%, transparent), 0 0 0 1px color-mix(in srgb, var(--panel-edge) 30%, transparent);
  padding: clamp(16px, 4vw, 36px);
  overflow: hidden;
}
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.mistakes { display: flex; align-items: center; gap: 12px; color: var(--amber); font-size: 1.15rem; letter-spacing: .04em; }
.pips { display: flex; gap: 6px; }
.pip { width: 11px; height: 11px; border: 1.5px solid var(--amber-dim); }
.pip.hit { background: var(--ember); border-color: var(--ember); }
.line { min-width: 220px; }
.line-row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; color: var(--amber-dim); font-size: 1.15rem; letter-spacing: .04em; }
.line-row time { color: var(--ink); font-family: "Courier Prime", monospace; font-size: 1.3rem; }
.line-row time.low { color: var(--ember); }
.bar { height: 3px; background: color-mix(in srgb, var(--muted) 40%, transparent); margin-top: 8px; }
.bar span { display: block; height: 100%; background: var(--amber); transition: width 1s linear; }
.clue { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 26px 0 0; }
.photo {
  background: color-mix(in srgb, var(--room) 60%, var(--panel));
  border: 1px solid var(--panel-edge); border-radius: 8px;
  padding: 14px 26px; font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1.1; letter-spacing: .12em;
  box-shadow: inset 0 0 30px color-mix(in srgb, var(--room) 70%, transparent);
}
.photo.has-img { padding: 0; width: 200px; height: 200px; overflow: hidden; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.when { color: var(--amber-dim); font-family: "Courier Prime", monospace; font-size: .95rem; margin: 0; }
.hint-btn { background: none; border: 0; color: var(--amber); font: 400 1rem "Oswald", sans-serif; text-decoration: underline; cursor: pointer; padding: 4px 8px; }
.hint-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.hint { color: var(--ink); font-family: "Courier Prime", monospace; font-size: .95rem; margin: 0; text-align: center; max-width: 46ch; line-height: 1.45; }

.message {
  display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
  column-gap: clamp(14px, 3vw, 30px); row-gap: 18px;
  min-height: 150px; margin: 22px 0 28px;
}
.word { display: flex; align-items: flex-end; }
.cell {
  display: flex; flex-direction: column; align-items: center;
  width: clamp(24px, 5.2vw, 44px); margin: 0 2px;
  background: none; border: 0; padding: 4px 0 0; color: inherit; font: inherit; cursor: pointer;
  border-radius: 3px;
}
.cell .ch {
  height: clamp(30px, 6vw, 50px); display: flex; align-items: center; justify-content: center;
  font-size: clamp(1.4rem, 4.4vw, 2.4rem); font-weight: 500; color: var(--amber);
  width: 100%; border-bottom: 1.5px solid color-mix(in srgb, var(--muted) 70%, transparent);
}
.cell .ch:empty::before { content: "·"; color: var(--muted); font-size: 1.2rem; }
.cell .num { font-family: "Courier Prime", monospace; font-size: clamp(.72rem, 1.9vw, .95rem); color: var(--amber-dim); margin-top: 6px; }
.cell.done .num { color: var(--muted); }
.cell.same .ch { border-bottom-color: var(--amber); }
.cell.active { background: color-mix(in srgb, var(--amber) 22%, transparent); }
.cell.active .ch { border-bottom: 2px solid var(--amber); }
.cell:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.cell.flash .ch { animation: flash .45s; }
@keyframes flash { 0%,100% { color: var(--amber); } 40% { color: var(--ember); transform: translateX(-3px); } 70% { transform: translateX(3px); } }
.punct { font-size: clamp(1.4rem, 4.4vw, 2.4rem); color: var(--amber); align-self: flex-start; padding-top: clamp(4px, 1vw, 10px); margin-left: 1px; }

.keys { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.row { display: flex; gap: 6px; justify-content: center; width: 100%; }
.key {
  flex: 0 1 54px; min-width: 0; height: clamp(42px, 9vw, 58px);
  background: var(--key); color: var(--ink);
  border: 1px solid var(--panel-edge); border-radius: 6px;
  font: 500 clamp(1rem, 3.2vw, 1.3rem) "Oswald", sans-serif; cursor: pointer;
}
.key:hover:not(:disabled) { border-color: var(--amber); }
.key:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.key:disabled { background: var(--key-used); color: var(--muted); border-color: transparent; cursor: default; }
.key.wrong:disabled { background: var(--key); border-color: color-mix(in srgb, var(--ember) 60%, transparent); color: var(--ember); text-decoration: line-through; }

.overlay {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--panel) 92%, transparent); padding: 24px; text-align: center;
}
.overlay.show { display: flex; }
.card { max-width: 560px; }
.card h2 { margin: 0 0 6px; font-weight: 500; font-size: clamp(1.6rem, 5vw, 2.3rem); color: var(--amber); }
.card .who { font-family: "Courier Prime", monospace; color: var(--amber-dim); margin: 0 0 22px; }
.card blockquote { margin: 0 0 26px; font-family: "Courier Prime", monospace; font-size: clamp(1.05rem, 3vw, 1.3rem); line-height: 1.55; color: var(--ink); }
.card .tally { color: var(--amber-dim); margin: 0 0 22px; font-size: 1rem; }
.btn {
  background: var(--amber); color: var(--room); border: 0; border-radius: 6px;
  font: 500 1.15rem "Oswald", sans-serif; padding: 12px 28px; cursor: pointer; letter-spacing: .03em;
}
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.intro p { font-family: "Courier Prime", monospace; line-height: 1.6; color: var(--ink); margin: 0 0 14px; text-align: left; }

@media (prefers-reduced-motion: reduce) { .cell.flash .ch { animation: none; } .bar span { transition: none; } }

.phone { min-height: min(720px, calc(100vh - 32px)); }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.link { background: none; border: 0; color: var(--amber-dim); font: 400 1rem "Oswald", sans-serif; cursor: pointer; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--amber); }
.link:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.overlay { overflow-y: auto; align-items: flex-start; background: var(--panel); }
.overlay .card { margin: auto; width: 100%; }
.step-count { font-family: "Courier Prime", monospace; color: var(--amber-dim); margin: 0 0 8px; }
.demo { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 18px 0 20px; min-height: 150px; justify-content: center; }
.demo-row { display: flex; align-items: flex-end; justify-content: center; gap: 4px; flex-wrap: wrap; }
.d { display: flex; flex-direction: column; align-items: center; width: 38px; padding-top: 4px; border-radius: 3px; }
.d b { height: 40px; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 500; color: var(--amber); border-bottom: 1.5px solid color-mix(in srgb, var(--muted) 70%, transparent); }
.d i { font-style: normal; font-family: "Courier Prime", monospace; font-size: .85rem; color: var(--amber-dim); margin-top: 5px; }
.d.pick { background: color-mix(in srgb, var(--amber) 22%, transparent); }
.d.pick b, .d.twin b { border-bottom: 2px solid var(--amber); }
.d.new b { color: var(--ink); }
.arrow { font-family: "Courier Prime", monospace; color: var(--amber-dim); font-size: .95rem; }
.kcap { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 46px; background: var(--key); color: var(--ink); border: 1px solid var(--panel-edge); border-radius: 6px; font-size: 1.2rem; font-weight: 500; }
.kcap.bad { color: var(--ember); border-color: color-mix(in srgb, var(--ember) 60%, transparent); text-decoration: line-through; }
.demo .pips { margin-left: 4px; }
.demo .photo { font-size: 2.2rem; padding: 10px 20px; }
.tut-text { font-family: "Courier Prime", monospace; line-height: 1.6; color: var(--ink); margin: 0 auto 22px; max-width: 44ch; min-height: 6.4em; }
.tut-actions { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; }
.btn.ghost { background: none; color: var(--amber); border: 1px solid var(--panel-edge); }
.dots { display: flex; justify-content: center; gap: 8px; margin: 0 0 18px; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: color-mix(in srgb, var(--muted) 60%, transparent); }
.dots span.on { background: var(--amber); }
.topics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 22px 0 18px; }
.topic { background: var(--key); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 20px 14px; color: var(--ink); cursor: pointer; font-family: "Oswald", sans-serif; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.topic:hover { border-color: var(--amber); }
.topic:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.topic .ico { font-size: 2.4rem; line-height: 1.1; }
.topic .name { font-size: 1.35rem; font-weight: 500; color: var(--amber); }
.topic .sub { font-family: "Courier Prime", monospace; font-size: .85rem; color: var(--amber-dim); }
.end-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

.field { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 22px 0 8px; }
.field input {
  width: min(320px, 100%); padding: 12px 14px; text-align: center;
  background: var(--key); color: var(--ink); border: 1px solid var(--panel-edge); border-radius: 6px;

}
.field input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.note { font-family: "Courier Prime", monospace; color: var(--amber-dim); font-size: .9rem; margin: 10px 0 0; min-height: 1.3em; }
.note.bad { color: var(--ember); }
.points { font-size: clamp(1.8rem, 6vw, 2.6rem); color: var(--amber); font-weight: 500; margin: 0 0 4px; }
.points-detail { font-family: "Courier Prime", monospace; color: var(--amber-dim); margin: 0 0 20px; font-size: .95rem; }
.topic:disabled { cursor: default; border-color: transparent; background: var(--key-used); }
.topic:disabled .name { color: var(--muted); }
.topic .sub b { color: var(--ink); font-weight: 700; }
.rows { list-style: none; margin: 0 auto 18px; padding: 0; max-width: 460px; text-align: left; font-family: "Courier Prime", monospace; }
.rows li { display: flex; justify-content: space-between; gap: 14px; padding: 7px 4px; border-bottom: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); color: var(--ink); }
.rows li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows li span:last-child { color: var(--amber); flex: none; }
.rows li.me { background: color-mix(in srgb, var(--amber) 16%, transparent); }
.rows li .rank { color: var(--amber-dim); margin-right: 8px; }
.link-row { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 14px; }

<main class="phone" id="phone">
  <div class="nav">
    <button class="link" id="quitBtn">End topic</button>
    <span class="when" id="progress"></span>
    <button class="link" id="helpBtn">How to play</button>
  </div>
  <div class="top">
    <div class="mistakes">Mistakes <div class="pips" id="pips"></div></div>
    <div class="line">
      <div class="line-row"><span>Time left</span><time id="clock">03:00</time></div>
      <div class="bar"><span id="bar" style="width:100%"></span></div>
    </div>
  </div>
  <div class="clue">
    <div class="photo" id="photo" role="img" aria-label="Picture clue"></div>
    <p class="when" id="when"></p>
    <button class="hint-btn" id="hintBtn">Show a written hint</button>
    <p class="hint" id="hint" hidden></p>
  </div>
  <div class="message" id="message" aria-live="polite"></div>
  <div class="keys" id="keys"></div>

  <div class="overlay" id="tutorial">
    <div class="card">
      <p class="step-count" id="tutCount"></p>
      <h2 id="tutTitle"></h2>
      <div class="demo" id="tutDemo"></div>
      <p class="tut-text" id="tutText"></p>
      <div class="dots" id="tutDots"></div>
      <div class="tut-actions">
        <button class="btn ghost" id="tutBack">Back</button>
        <button class="btn" id="tutNext">Next</button>
        <button class="link" id="tutSkip">Skip the tutorial</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="nameScreen">
    <div class="card">
      <h2>What should we call you?</h2>
      <p class="who">Your name goes on the leaderboard next to your total score.</p>
      <div class="field">
        <input id="nameInput" type="text" maxlength="20" autocomplete="off" aria-label="Your name" placeholder="Your name">
        <button class="btn" id="nameBtn">Continue</button>
      </div>
      <p class="note bad" id="nameNote"></p>
    </div>
  </div>

  <div class="overlay" id="topics">
    <div class="card">
      <h2 id="topicsTitle">Pick a topic</h2>
      <p class="who" id="topicsWho"></p>
      <div class="topics" id="topicList"></div>
      <div class="link-row">
        <button class="link" id="topicBoard">Leaderboard</button>
        <button class="link" id="topicHelp">How to play</button>
        <button class="link" id="switchBtn">Switch player</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="end">
    <div class="card">
      <h2 id="endTitle"></h2>
      <p class="who" id="endWho"></p>
      <blockquote id="endQuote"></blockquote>
      <p class="points" id="endPoints"></p>
      <p class="points-detail" id="endDetail"></p>
      <div class="end-actions">
        <button class="btn" id="nextBtn">Next code</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="summary">
    <div class="card">
      <h2 id="sumTitle"></h2>
      <p class="points" id="sumPoints"></p>
      <p class="points-detail" id="sumDetail"></p>
      <ul class="rows" id="sumRows"></ul>
      <p class="who" id="sumLeft"></p>
      <div class="end-actions">
        <button class="btn" id="sumNext">Pick the next topic</button>
        <button class="btn ghost" id="sumBoard">Leaderboard</button>
      </div>
      <p class="note" id="sumNote"></p>
    </div>
  </div>

  <div class="overlay" id="board">
    <div class="card">
      <h2>Leaderboard</h2>
      <p class="who">Total score across all topics</p>
      <ul class="rows" id="boardRows"></ul>
      <p class="note" id="boardNote"></p>
      <div class="end-actions">
        <button class="btn" id="boardBack">Back</button>
      </div>
    </div>
  </div>
</main>

const IMAGES = {};
for (const line of IMAGE_TABLE.split("\n")) {
  const cellsIn = line.split("\t").map(c => c.trim()).filter(Boolean);
  const link = cellsIn.find(c => /^https?:\/\//i.test(c));
  const source = cellsIn.find(c => /\(\d{4}\)$/.test(c));
  if (link && source) (IMAGES[normKey(source)] = IMAGES[normKey(source)] || []).push(link);
}
function setPhoto(call) {
  const box = $("photo");
  box.classList.remove("has-img");
  box.textContent = call.pic;
  const url = (IMAGES[normKey(`${call.title} (${call.year})`)] || [])[call.nth];
  if (!url) return;
  const img = new Image();
  img.alt = "Picture clue";
  img.referrerPolicy = "no-referrer";
  img.onload = () => {
    if (!state || state.call !== call) return;
    box.textContent = ""; box.appendChild(img); box.classList.add("has-img");
  };
  img.src = url;
}

/* ---------- scoring ---------- */
// A cracked quote: 400 base, plus 3 per second left, minus 80 per mistake (never below 50). A lost quote: 0.
function quotePoints(won, secondsLeft, mistakes) {
  return won ? Math.max(50, 400 + 3 * secondsLeft - 80 * mistakes) : 0;
}

  round = null;

  $("topicsTitle").textContent = left.length ? "Pick a topic" : "All topics scored";

  const list = $("topicList"); list.innerHTML = "";
  for (const [key, t] of Object.entries(TOPICS)) {
    const done = profile.scores[key] != null;
    const b = document.createElement("button"); b.className = "topic"; b.disabled = done;
    b.innerHTML = `<span class="ico">${t.ico}</span><span class="name">${t.name}</span><span class="sub">${done ? `Scored: <b>${fmt(profile.scores[key])}</b>` : `${ROUND_SIZE} quotes`}</span>`;
    b.addEventListener("click", () => startRound(key));
    list.appendChild(b);
  }
  const first = list.querySelector("button:not(:disabled)") || $("topicBoard"); first.focus();
}

/* ---------- rounds ---------- */
function startRound(key) {
  const calls = TOPICS[key].calls;
  round = { key, queue: shuffle([...calls.keys()]).slice(0, ROUND_SIZE), i: 0, score: 0, results: [] };
  hideAll(); newGame();
}

function currentCall() {
  const calls = TOPICS[round.key].calls, idx = round.queue[round.i];
  const [text, pic, year, hint, title] = unscramble(calls[idx]);
  const nth = calls.slice(0, idx).filter(c => { const o = unscramble(c); return o[4] === title && o[2] === year; }).length;
  return { text, pic, hint, title, year, nth, when: TOPICS[round.key].when + " " + year };
}

function finishRound() {
  clearInterval(timer);
  if (state) state.over = true;
  const key = round.key, t = TOPICS[key], results = round.results, score = round.score;
  profile.scores[key] = score; save("ctc-profile", profile);
  round = null;
  hideAll(); show("summary");
  $("sumTitle").textContent = `${t.ico} ${t.name} complete`;
  $("sumPoints").textContent = `${fmt(score)} points`;
  $("sumDetail").textContent = `Cracked ${results.filter(r => r.won).length} of ${ROUND_SIZE}. Total across topics: ${fmt(totalScore())}`;
  const rows = $("sumRows"); rows.innerHTML = "";
  for (let i = 0; i < ROUND_SIZE; i++) {
    const r = results[i], li = document.createElement("li"), a = document.createElement("span"), b = document.createElement("span");
    a.textContent = r ? r.title : "Not played"; b.textContent = r ? fmt(r.points) : "0";
    li.append(a, b); rows.appendChild(li);
  }
  const left = unscored();
  $("sumLeft").textContent = left.length
    ? `Not scored yet: ${left.map(k => TOPICS[k].name).join(", ")}`
    : "You have scored every topic.";
  $("sumNext").textContent = left.length ? "Pick the next topic" : "Back to topics";
  $("sumNext").focus();
  const note = $("sumNote"); note.className = "note"; note.textContent = "Saving your total to the leaderboard…";
  submitScore().then(
    () => { note.textContent = "Total saved to the leaderboard."; },
    () => { note.className = "note bad"; note.textContent = "Could not reach the leaderboard. Your score is kept on this device."; }
  );
}

/* ---------- leaderboard ---------- */
async function submitScore() {
  const res = await fetch(BOARD.url + "entries", {
    method: "POST",
    headers: { "x-api-key": BOARD.key, "Content-Type": "application/json" },
    body: JSON.stringify({
      leaderboardId: BOARD.id, playerId: profile.id, playerDisplayName: profile.name,
      score: String(totalScore()), metadata: JSON.stringify(profile.scores)
    })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
}
let boardFrom = "topics";
async function openBoard(from) {
  boardFrom = from; hideAll(); show("board");
  const rows = $("boardRows"), note = $("boardNote");
  rows.innerHTML = ""; note.className = "note"; note.textContent = "Loading…";
  $("boardBack").focus();
  try {
    const res = await fetch(BOARD.url + "leaderboards/" + BOARD.id + "/entries", { headers: { "x-api-key": BOARD.key } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const best = new Map();   // one row per player, highest total
    for (const e of Array.isArray(data) ? data : []) {
      const id = e.playerId || e.id, score = Number(e.score) || 0;
      if (!best.has(id) || best.get(id).score < score) best.set(id, { id, name: String(e.playerDisplayName || "Player"), score });
    }
    const all = [...best.values()].sort((a, b) => b.score - a.score);
    all.forEach((e, i) => e.rank = i + 1);
    const shown = all.slice(0, 10), me = all.find(e => e.id === profile.id);
    if (me && !shown.includes(me)) shown.push(me);
    for (const e of shown) {
      const li = document.createElement("li"), a = document.createElement("span"), r = document.createElement("span"), b = document.createElement("span");
      r.className = "rank"; r.textContent = e.rank + ".";
      a.append(r, document.createTextNode(e.name)); b.textContent = fmt(e.score);
      if (e.id === profile.id) li.className = "me";
      li.append(a, b); rows.appendChild(li);
    }
    note.textContent = all.length ? "" : "No scores yet. Finish a topic to be the first.";
  } catch {
    note.className = "note bad"; note.textContent = "Could not reach the leaderboard.";
  }
}
$("topicBoard").addEventListener("click", () => openBoard("topics"));
$("sumBoard").addEventListener("click", () => openBoard("summary"));
$("boardBack").addEventListener("click", () => { if (boardFrom === "summary") { hideAll(); show("summary"); } else openTopics(); });

/* ---------- game ---------- */
function newGame() {
  disarmQuit();
  const call = currentCall();
  const upper = call.text.toUpperCase();
  const letters = shuffle([...new Set(upper.replace(/[^A-Z]/g, ""))]);
  const code = {}; letters.forEach((l, i) => code[l] = i + 1);
  const counts = {}; for (const ch of upper) if (code[ch]) counts[ch] = (counts[ch] || 0) + 1;
  const giveCount = letters.length > 14 ? 3 : letters.length > 8 ? 2 : 1;
  const repeated = shuffle(letters.filter(l => counts[l] > 1));
  const given = (repeated.length ? repeated : shuffle([...letters])).slice(0, giveCount);
  state = { call, upper, code, solved: new Set(given), wrongBy: {}, misses: 0, left: CALL_SECONDS, active: null, over: false };
  setPhoto(call);
  $("when").textContent = TOPICS[round.key].name + ". " + call.when;
  $("progress").textContent = `Quote ${round.i + 1} of ${ROUND_SIZE} · ${fmt(round.score)} pts`;
  $("hint").textContent = call.hint; $("hint").hidden = true; $("hintBtn").hidden = false;
  render();
  selectFirstOpen();
  clearInterval(timer);
  timer = setInterval(tick, 1000);
  updateClock();
}

function render() {
  const msg = $("message"); msg.innerHTML = "";
  state.answers = {};
  let idx = 0;
  for (const raw of state.upper.split(" ")) {
    const w = document.createElement("div"); w.className = "word";
    for (const ch of raw) {
      if (state.code[ch]) {
        const n = state.code[ch];
        const b = document.createElement("button");
        b.className = "cell"; b.dataset.idx = idx; b.dataset.n = n; state.answers[idx] = ch;
        b.setAttribute("aria-label", "Number " + n);
        b.innerHTML = `<span class="ch"></span><span class="num">${String(n).padStart(2, "0")}</span>`;
        b.addEventListener("click", () => select(+b.dataset.idx));
        w.appendChild(b);
      } else {
        const p = document.createElement("span"); p.className = "punct"; p.textContent = ch; w.appendChild(p);
      }
      idx++;
    }
    idx++;
    msg.appendChild(w);
  }
  const keys = $("keys"); keys.innerHTML = "";
  ROWS.forEach(r => {
    const row = document.createElement("div"); row.className = "row";
    for (const l of r) {
      const k = document.createElement("button"); k.className = "key"; k.textContent = l; k.dataset.l = l;
      k.addEventListener("click", () => guess(l));
      row.appendChild(k);
    }
    keys.appendChild(row);
  });
  refresh();
}

const L = c => state.answers[c.dataset.idx];
function cells() { return [...document.querySelectorAll(".cell")]; }

function refresh() {
  const act = state.active != null ? cells().find(c => +c.dataset.idx === state.active) : null;
  const actN = act ? act.dataset.n : null;
  cells().forEach(c => {
    const ok = state.solved.has(L(c));
    c.querySelector(".ch").textContent = ok ? L(c) : "";
    c.classList.toggle("done", ok);
    c.classList.toggle("active", c === act);
    c.classList.toggle("same", !ok && c !== act && c.dataset.n === actN);
  });
  document.querySelectorAll(".key").forEach(k => {
    const l = k.dataset.l;
    const triedHere = !!(actN && state.wrongBy[actN] && state.wrongBy[actN].has(l));
    k.disabled = state.over || state.solved.has(l) || triedHere;
    k.classList.toggle("wrong", triedHere && !state.over);
  });
  const pips = $("pips"); pips.innerHTML = "";
  for (let i = 0; i < MAX_MISS; i++) { const p = document.createElement("span"); p.className = "pip" + (i < state.misses ? " hit" : ""); pips.appendChild(p); }
}

function select(idx) {
  if (state.over) return;
  const c = cells().find(c => +c.dataset.idx === idx);
  if (!c || state.solved.has(L(c))) return;
  state.active = idx; refresh();
}

function selectFirstOpen(after = -1) {
  const open = cells().filter(c => !state.solved.has(L(c)));
  const pick = open.find(c => +c.dataset.idx > after) || open[0];
  state.active = pick ? +pick.dataset.idx : null;
  refresh();
}

function guess(l) {
  if (state.over || state.active == null || state.solved.has(l)) return;
  const c = cells().find(c => +c.dataset.idx === state.active);
  const tried = state.wrongBy[c.dataset.n] || (state.wrongBy[c.dataset.n] = new Set());
  if (tried.has(l)) return;
  if (L(c) === l) {
    state.solved.add(l);
    if (cells().every(x => state.solved.has(L(x)))) return finish(true);
    selectFirstOpen(state.active);
  } else {
    state.misses++; tried.add(l);
    c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash");
    refresh();
    if (state.misses >= MAX_MISS) finish(false, "Too many wrong letters.");
  }
}

function tick() {
  state.left--; updateClock();
  if (state.left <= 0) finish(false, "Time ran out.");
}
function updateClock() {
  const m = Math.floor(state.left / 60), s = state.left % 60;
  const t = $("clock"); t.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  t.classList.toggle("low", state.left <= 30);
  $("bar").style.width = (state.left / CALL_SECONDS * 100) + "%";
}

function finish(won, why) {
  state.over = true; clearInterval(timer); disarmQuit();
  state.active = null;
  refresh();
  const call = state.call, left = Math.max(0, state.left), misses = state.misses;
  const points = quotePoints(won, left, misses);
  round.score += points;
  round.results.push({ title: `${call.title} (${call.year})`, won, points });
  const last = round.i === ROUND_SIZE - 1;
  $("endTitle").textContent = won ? "Code cracked" : why;
  $("endWho").textContent = `${call.pic}  ${call.title} (${call.year})`;
  $("endQuote").textContent = "“" + call.text + "”";
  $("endPoints").textContent = `+ ${fmt(points)} points`;
  $("endDetail").textContent = won
    ? `${left}s left, ${misses} ${misses === 1 ? "mistake" : "mistakes"}. Topic score: ${fmt(round.score)}`
    : `No points for a lost quote. Topic score: ${fmt(round.score)}`;
  $("nextBtn").textContent = last ? "See topic score" : "Next code";
  $("progress").textContent = `Quote ${round.i + 1} of ${ROUND_SIZE} · ${fmt(round.score)} pts`;
  setTimeout(() => { if (state.call === call && round) { show("end"); $("nextBtn").focus(); } }, won ? 600 : 300);
}

function overlayOpen() { return !!document.querySelector(".overlay.show"); }

document.addEventListener("keydown", e => {
  if (!state || state.over || overlayOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if (/^[A-Z]$/.test(k)) { e.preventDefault(); guess(k); return; }
  const open = cells().filter(c => !state.solved.has(L(c)));
  if (!open.length) return;
  const i = open.findIndex(c => +c.dataset.idx === state.active);
  if (e.key === "ArrowRight") select(+open[(i + 1) % open.length].dataset.idx);
  if (e.key === "ArrowLeft") select(+open[(i - 1 + open.length) % open.length].dataset.idx);
});

$("hintBtn").addEventListener("click", () => { $("hint").hidden = false; $("hintBtn").hidden = true; });
$("nextBtn").addEventListener("click", () => {
  hide("end");
  round.i++;
  if (round.i >= ROUND_SIZE) finishRound(); else newGame();
});
$("helpBtn").addEventListener("click", openTutorial);
$("topicHelp").addEventListener("click", openTutorial);

if (!load("lastcall-tutorial-seen", false)) openTutorial();
else if (!profile) openName();
else openTopics();
})();
</script>
